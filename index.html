<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>天枢 · 洞察</title>
<meta name="description" content="天枢·洞察：把需求写下来，给你一份能验收的结果。">
<style>
  :root{--bg:#080c18;--fg:#e0e6f0;--head:#f0f4ff;--muted:#8a93b0;--dim:#6b7390;
        --blue:#5b8def;--blue-l:#93c5fd;--line:rgba(148,163,184,.18);
        --mono:'SF Mono','Fira Code','Courier New',monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
       font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:0 24px}
  #stars{position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:0}
  main{position:relative;z-index:1;width:100%;max-width:680px;flex:1;
       display:flex;flex-direction:column;justify-content:center;padding:64px 0}
  .brand{font-size:clamp(1.9rem,4.6vw,2.9rem);font-weight:750;letter-spacing:-.02em;margin-bottom:26px;
         background:linear-gradient(135deg,#bfdbfe 0%,#93c5fd 35%,#3b82f6 100%);
         -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.15}
  .brand b{font-weight:750}
  h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.15;margin:0 0 12px;color:var(--head);letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 36px;font-size:15px}
  textarea{width:100%;min-height:150px;resize:vertical;padding:16px 18px;border-radius:10px;
           background:#0f172a;border:1px solid var(--line);color:var(--fg);font:inherit;
           outline:none;transition:border-color .2s}
  textarea::placeholder{color:var(--dim)}
  textarea:focus{border-color:var(--blue)}
  .row{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:12px;flex-wrap:wrap}
  button{font:inherit;font-size:15px;padding:12px 28px;border-radius:8px;border:1px solid var(--blue);
         background:var(--blue);color:#fff;cursor:pointer;transition:.2s}
  button:hover{background:#4a7ae0;border-color:#4a7ae0}
  .hint{font-size:13px;color:var(--dim)}
  footer{position:relative;z-index:1;width:100%;max-width:680px;padding:24px 0 40px;
         font-size:12px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
  footer a{color:var(--dim);text-decoration:none}footer a:hover{color:var(--blue-l)}
  @media(max-width:560px){.flow{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main>
  <div class="brand">天枢 <b>洞察</b></div>
  <h1>把需求写下来</h1>
  <p class="sub">一段话就行：你要什么、现在卡在哪。我回你一份能验收的结果。</p>

  <textarea id="need" placeholder="请用一段话描述你的需求，例如：我想知道深圳宠物洗护店在抖音上都在拍什么、哪类内容更容易带来私信，帮我整理一份带来源的清单。"></textarea>
  <div class="row">
    <span class="hint" id="hint">点发送会用你的邮件客户端发给我</span>
    <button id="send">发送需求</button>
  </div>
</main>

<footer>
  <span>© 2026 天枢 · 洞察</span>
  <a href="https://tianshu.shop">天枢 · 探索</a>
  <a href="https://dubhehub.com">API 网关</a>
</footer>

<script>
/* 星空背景：与中转站 dubhehub.com 首页同一套实现；密度按 60–80 颗收（不照抄 600） */
(function(){
  var c=document.getElementById('stars');
  var ctx=c.getContext('2d');
  var stars=[];
  var NUM=70;
  function resize(){
    var w=window.innerWidth;
    var h=Math.max(document.body.scrollHeight,window.innerHeight);
    if(w!==c.width||h!==c.height){
      c.width=w;c.height=h;
      stars=[];
      for(var i=0;i<NUM;i++){
        stars.push({
          x:Math.random()*w,y:Math.random()*h,
          r:Math.random()*1.8+0.3,
          alpha:Math.random(),
          speed:Math.random()*0.012+0.003,
          hue:Math.random()>0.7?210+Math.random()*30:0
        });
      }
    }
  }
  window.addEventListener('resize',resize);
  resize();
  setTimeout(resize,500);
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<NUM;i++){
      var s=stars[i];s.alpha+=s.speed;
      if(s.alpha>1)s.alpha=0;
      var a=Math.abs(Math.sin(s.alpha*Math.PI));
      if(s.hue){
        ctx.fillStyle='hsla('+s.hue+',60%,80%,'+a*0.7+')';
      }else{
        ctx.fillStyle='rgba(255,255,255,'+a*0.8+')';
      }
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
/* 发送：把需求拼成邮件正文 */
document.getElementById('send').onclick=function(){
  var t=document.getElementById('need').value.trim();
  if(t.length<5){ document.getElementById('hint').textContent='再多写几个字，我好知道你要什么'; return; }
  var sub=encodeURIComponent('天枢洞察 · 需求：'+t.slice(0,30));
  var body=encodeURIComponent('我的需求：\n\n'+t+'\n\n—— 从天枢·洞察页面提交');
  location.href='mailto:boyuan472@gmail.com?subject='+sub+'&body='+body;
};
</script>
</body>
</html>
