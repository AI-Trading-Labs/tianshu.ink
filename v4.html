<body>
<div class="stars"></div>
<div class="top">
<div class="top-left">天枢智能 · AI内容生成系统</div>
<div class="top-right"><a href="/">首页</a><a href="content-factory.html">内容工厂</a></div>
</div>
<div class="container">
<div class="title">天枢智能</div>
<div class="sub">小说 · 文案 · 脚本 · AI内容生成</div>

<div class="agent-steps">
<span class="agent-step" id="step1">🧠 分析Agent</span>
<span class="agent-step" id="step2">⚙️ 执行Agent</span>
<span class="agent-step" id="step3">🔍 优化Agent</span>
</div>

<textarea id="input" placeholder="输入创作需求：写小说 / 写文案 / 生成脚本"></textarea>
<button onclick="runAgents()">开始创作</button>

<div class="samples">
<span onclick="setInput('写一个都市逆袭小说的第一章开头，主角叫林小满')">📝 小说</span>
<span onclick="setInput('写一篇茶叶产品的电商文案，突出高山云雾')">📝 文案</span>
<span onclick="setInput('生成长度30秒的茶叶带货短视频脚本')">🎬 脚本</span>
<span onclick="setInput('写一篇关于AI交易入门知识的科普文章')">📝 科普文</span>
</div>

<div class="output" id="output"></div>
</div>
<div style="text-align:center;padding:8px 24px 0;">
<p style="font-size:11px;color:#334155;">· 本站所有内容由AI生成，仅供学习参考，不构成任何投资建议 ·<br>投资有风险，入市需谨慎。</p>
</div><div class="footer">© 2026 <a href="https://tianshu.shop">天枢</a> · 以上内容由AI生成仅供参考</div>

<script>
function setInput(t) { document.getElementById("input").value = t; document.getElementById("input").focus(); }

function setStep(n, state) {
 for(let i=1;i<=3;i++) {
   const el = document.getElementById('step'+i);
   el.classList.remove('active','done');
   if(i < n) el.classList.add('done');
   else if(i === n) el.classList.add(state||'active');
 }
}

async function runAgents() {
 const input = document.getElementById("input").value;
 const output = document.getElementById("output");
 if (!input.trim()) { alert("请输入内容"); return; }
 output.classList.add("show");
 setStep(1,'active');

 // Step 1: 分析Agent
 output.innerHTML = '<span class="agent-tag analyst">🧠 分析Agent</span>正在分析任务类型...';
 await sleep(800);
 const v = input;
 let type = '写作';
 if(v.includes('小说')||v.includes('故事')||v.includes('逆袭')||v.includes('战神')) type = '小说';
 else if(v.includes('视频')||v.includes('脚本')||v.includes('带货')) type = '视频';
 else type = '文案';
 const analysis = `【分析Agent判定】\n任务类型：${type}\n复杂度：中等\n建议策略：结构化输出`;
 output.innerHTML = '<span class="agent-tag analyst">🧠 分析Agent</span>'+analysis.replace(/\n/g,'<br>');
 await sleep(600);
 setStep(2,'active');

 // Step 2: 执行Agent
 output.innerHTML += '\n\n<span class="agent-tag worker">⚙️ 执行Agent</span>正在生成内容...';
 await sleep(1000);
 let result = '';
 if(type === '小说') {
   result = '【小说章节】\n标题：逆袭从编程开始\n林默在出租屋敲完最后一行代码，屏幕突然黑了。"系统绑定成功。"\n【能力】编程Lv.3 商业Lv.1\n【任务】三天内赚到第一桶金';
 } else if(type === '视频') {
   result = '【短视频脚本】\n时长：30秒\n0-3s：特写茶汤\n4-20s：冲泡+产地\n21-28s：口感描述+好评\n29-30s：引导下单\n配乐：国风竹笛';
 } else {
   result = '【写作内容】\n已收到你的需求。建议拆分为以下模块：\n1. 核心主题\n2. 分论点\n3. 案例支撑\n4. 总结建议';
 }
 output.innerHTML += '<br><span class="agent-tag worker">⚙️ 执行Agent</span>'+result.replace(/\n/g,'<br>');
 await sleep(600);
 setStep(3,'active');

 // Step 3: 优化Agent
 output.innerHTML += '\n\n<span class="agent-tag critic">🔍 优化Agent</span>正在优化输出...';
 await sleep(1000);
 const optimized = result + '\n\n【优化Agent校验】\n✓ 逻辑完整性：通过\n✓ 结构清晰度：通过\n✓ 可执行性：高';
 output.innerHTML += '<br><span class="agent-tag critic">🔍 优化Agent</span>'+optimized.replace(/\n/g,'<br>');
 setStep(3,'done');
 output.innerHTML += '\n\n—— 天枢 v4 多智能体分析完毕 ——';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
<script>(function(){var c=document.querySelector(".stars");if(!c)return;for(var i=0;i<80;i++){var s=document.createElement("div");s.className="star";s.style.left=(Math.random()*100)+"%";s.style.top=(Math.random()*100)+"%";s.style.animationDelay=(Math.random()*4)+"s";s.style.width=(Math.random()*2+1)+"px";c.appendChild(s);}})();</script>
